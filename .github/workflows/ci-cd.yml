name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # JOB 1: Lint (Code Quality) - Using Ruff

  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (linter)
        run: ruff check src/

      - name: Run Ruff (formatter)
        run: ruff format src/ --check

  # JOB 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint # Wait for lint to pass before running tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .   # Install the src package

      - name: Create dummy database for testing
        run: |
          python -c "
          import sqlite3
          import pandas as pd
          import numpy as np

          conn = sqlite3.connect('VNF_performance_metrics.db')
          n_samples = 500
          data = {
              'Timestamp': pd.date_range('2026-05-09', periods=n_samples, freq='1s').astype(str),
              'cpu_usage_firewall': np.random.rand(n_samples) * 100,
              'traffic_rate_firewall': np.random.rand(n_samples) * 1000,
              'processing_delay_firewall': np.random.rand(n_samples) * 10,
              'cpu_usage_dpi': np.random.rand(n_samples) * 100,
              'traffic_rate_dpi': np.random.rand(n_samples) * 1000,
              'processing_delay_dpi': np.random.rand(n_samples) * 10,
              'cpu_usage_enc': np.random.rand(n_samples) * 100,
              'traffic_rate_enc': np.random.rand(n_samples) * 1000,
              'processing_delay_enc': np.random.rand(n_samples) * 10,
              'cpu_usage_comp': np.random.rand(n_samples) * 100,
              'traffic_rate_comp': np.random.rand(n_samples) * 1000,
              'processing_delay_comp': np.random.rand(n_samples) * 10,
              'memory_usage_dpi': np.random.rand(n_samples) * 1000,
          }
          pd.DataFrame(data).to_sql('VNF_KPI_database', conn, if_exists='replace', index=False)
          conn.close()
          print('Test database created successfully!')
          "

      - name: Verify test database
        run: |
          sqlite3 VNF_performance_metrics.db "SELECT COUNT(*) FROM VNF_KPI_database;"
          sqlite3 VNF_performance_metrics.db "SELECT * FROM VNF_KPI_database LIMIT 3;"

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
