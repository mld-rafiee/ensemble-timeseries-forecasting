[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-timeseries-forecasting"
version = "1.0.0"
description = "Stacking Ensemble for VNF Performance Metrics Forecasting"
authors = [
    {name = "Milad Rafiee", email = "mld.rafiee@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.10.0",
    "scikit-learn>=1.1.0",
    "pandas>=1.5.0,<2.0.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "xgboost>=1.7.0",
]

# Package discovery – use this only
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ================================================================
# Pytest Configuration
# ================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ================================================================
# Coverage Configuration
# ================================================================

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]