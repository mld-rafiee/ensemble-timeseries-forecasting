[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-timeseries-forecasting"
version = "1.0.0"
description = "Stacking Ensemble for VNF Performance Metrics Forecasting"
authors = [
    {name = "Milad Rafiee", email = "mld.rafiee@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.10.0",
    "scikit-learn>=1.1.0",
    "pandas>=1.5.0,<2.0.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "xgboost>=1.7.0",
]

# Package discovery – use this only
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ================================================================
# Ruff Configuration
# ================================================================

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "models", "plots", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C", "T", "S"]
ignore = ["E501", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ================================================================
# Pytest Configuration
# ================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ================================================================
# Coverage Configuration
# ================================================================

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]